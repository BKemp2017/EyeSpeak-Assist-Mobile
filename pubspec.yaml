name: eye_speak_mobile
description: Flutter mobile implementation of EyeSpeak Assist.
version: 0.1.0

environment:
  sdk: '>=2.17.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.0.15
  google_mlkit_commons: ^0.11.0   
  google_mlkit_face_detection: ^0.13.1
  camera: ^0.11.2
  flutter_tts: ^4.2.3
  image: ^4.1.7

flutter:
  uses-material-design: true
  assets:
    - assets/phrases.json
